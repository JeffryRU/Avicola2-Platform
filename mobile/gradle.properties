org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# URL de la API (sin barra final). Se puede cambiar al compilar: -Pavicola.apiUrl=https://...
avicola.apiUrl=https://avicola.13-140-234-184.sslip.io/api
avicola.apiUrlDev=https://avicola-dev.13-140-234-184.sslip.io/api
# Repositorio de GitHub donde se publican las versiones (para avisar de actualizaciones).
avicola.githubRepo=JeffryRU/Avicola2-Platform
# Versión de la app. El CI la toma del tag (v1.2.3) al publicar una Release.
avicola.versionName=0.1.0
avicola.versionCode=1
kotlin.native.ignoreDisabledTargets=true
