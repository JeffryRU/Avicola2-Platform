<!DOCTYPE html>
<html lang="es" data-brand="noraves">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noraves · Planificación de Demanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================== Tokens ===================== */
:root{
  --p:#1570EF;--p-600:#0F5BD1;--p-soft:#E8F1FE;--p-ring:rgba(21,112,239,.22);
  --ink:#0B2C61;--ink-2:#36507A;--muted:#6B7F9E;--faint:#9AAAC2;
  --line:#DCE7F5;--line-2:#EAF1FA;--bg:#F0F5FC;--card:#FFFFFF;--side:#F6F9FE;--head:#0B2C61;
  --accent:#FBBB21;--ok:#12A150;--ok-soft:#E3F6EA;--warn:#D97706;--warn-soft:#FEF3C7;--pend:#94A3B8;--pend-soft:#EEF2F7;
  --bad:#DC3B3F;--bad-soft:#FDECEC;--s2:#F97316;
  --t-blue:#1570EF;--t-green:#16A34A;--t-purple:#7C3AED;--t-amber:#F5A70B;--t-red:#EF4444;
  --r:18px;--r-sm:12px;--r-xs:10px;
  --sh:0 1px 2px rgba(11,44,97,.05),0 10px 30px rgba(11,44,97,.06);
  --sh-lg:0 24px 60px rgba(11,44,97,.18);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[data-brand="rocio"]{
  --p:#E2231A;--p-600:#B81B14;--p-soft:#FDECEC;--p-ring:rgba(226,35,26,.2);
  --ink:#1F1D1B;--ink-2:#4A4541;--muted:#7A736D;--faint:#A8A19B;
  --line:#E7E3DF;--line-2:#F1EEEB;--bg:#F6F5F3;--side:#FBFAF9;--head:#1F1D1B;--s2:#78716C;
  --t-blue:#E2231A;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--p-ring);outline-offset:2px;border-radius:8px}
.ic{flex:none;display:block}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.15}

/* ===================== Marca ===================== */
.mascot{position:relative;border-radius:50%;overflow:hidden;background:#fff;border:3px solid var(--accent);flex:none}
.mascot img{position:absolute;top:0;left:-17.3%;height:100%;width:auto}
.mwrap{display:flex;flex-direction:column;align-items:center}
.mwrap.anim .mascot{animation:hop 1.1s var(--ease) infinite}
.mwrap .shadow{width:56%;height:8px;border-radius:50%;background:rgba(11,44,97,.18);margin-top:8px}
.mwrap.anim .shadow{animation:shad 1.1s var(--ease) infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(-6deg)}55%{transform:translateY(0) rotate(3deg)}70%{transform:translateY(-4px) rotate(0)}}
@keyframes shad{0%,100%{transform:scaleX(1);opacity:1}30%{transform:scaleX(.6);opacity:.45}55%{transform:scaleX(1)}}
.iso.anim .spin{transform-origin:50px 52px;animation:spin 1.8s var(--ease) infinite}
.iso.anim .blade{animation:blade 1.8s var(--ease) infinite}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(120deg)}}
@keyframes blade{0%,100%{transform:translate(0,0)}45%{transform:translate(var(--dx),var(--dy))}}
.wordmark{font-weight:800;letter-spacing:-.04em;color:var(--ink)}
.logo{display:flex;align-items:center;gap:10px}
.logo .wordmark{font-size:26px}

/* ===================== Login ===================== */
.login{min-height:100vh;min-height:100dvh;display:grid;background:var(--bg)}
.login .photo{position:relative;background:#E9DCC8 center/cover no-repeat;overflow:hidden}
.login .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,44,97,.15),rgba(11,44,97,.55))}
.login .photo .cap{position:absolute;z-index:1;left:48px;bottom:48px;right:48px;color:#fff}
.login .photo .cap h2{font-size:34px;font-weight:800;max-width:14ch}
.login .photo .cap p{margin:8px 0 0;opacity:.9;max-width:42ch}
.login .side-form{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.lcard{width:100%;max-width:400px;background:var(--card);border-radius:24px;box-shadow:var(--sh-lg);padding:28px 24px 22px;text-align:center;animation:rise .5s var(--ease) both}
.lcard .mwrap{margin:-74px auto 6px}
.lcard h1{font-size:36px;font-weight:800;letter-spacing:-.04em}
.lcard .t2{color:var(--p);font-weight:800;font-size:19px;margin-top:4px}
.lcard .t3{color:var(--ink-2);margin:6px 0 20px}
.lfield{position:relative;margin-bottom:12px;text-align:left}
.lfield .ic{position:absolute;left:14px;top:15px;color:var(--muted)}
.lfield input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:0 44px;background:#fff;transition:border-color .15s,box-shadow .15s}
.lfield input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--p-ring)}
.lfield .eye{position:absolute;right:8px;top:7px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.lfield.err input{border-color:var(--bad)}
.lerr{color:var(--bad);font-size:13px;font-weight:600;text-align:left;margin:-4px 0 10px}
.lopts{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 0;font-size:14px;color:var(--ink-2)}
.lopts label{display:flex;align-items:center;gap:8px;cursor:pointer}
.lopts input{width:18px;height:18px;accent-color:var(--p)}
.lnote{margin-top:16px;font-size:12.5px;color:var(--muted)}
.mobile-photo{display:none}
@media (min-width:960px){.login{grid-template-columns:1.1fr 1fr}}
@media (max-width:959px){
  .login{grid-template-columns:1fr;position:relative}
  .login .photo{display:none}
  .mobile-photo{display:block;position:fixed;inset:0;background:#E9DCC8 center/cover;filter:saturate(1.05)}
  .mobile-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(240,245,252,.94) 0%,rgba(240,245,252,.55) 55%,rgba(240,245,252,.2) 100%)}
  .login .side-form{position:relative;z-index:1;align-items:flex-start;padding-top:96px}
}

/* ===================== Estructura ===================== */
.app{display:flex;min-height:100vh}
.side{width:268px;flex:none;background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 16px;overflow-y:auto}
.side .logo{padding:0 10px 22px}
.nav{display:grid;gap:2px}
.ni{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;color:var(--ink-2);font-weight:600;text-align:left;transition:background .15s,color .15s}
.ni:hover{background:var(--line-2);color:var(--ink)}
.ni.on{background:var(--p);color:#fff;box-shadow:0 6px 16px var(--p-ring)}
.ni.on.sub-on{background:var(--p-soft);color:var(--p);box-shadow:none}
.ni .chev{margin-left:auto;transition:transform .2s}
.ni.open .chev{transform:rotate(180deg)}
.ni .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:800;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.ni.soon{opacity:.55}
.subnav{display:grid;gap:2px;padding:4px 0 6px 22px;overflow:hidden}
.subnav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;text-align:left}
.subnav button::before{content:"";width:6px;height:6px;border-radius:50%;background:transparent}
.subnav button:hover{color:var(--ink)}
.subnav button.on{background:var(--p-soft);color:var(--p)}
.subnav button.on::before{background:var(--p)}
.side .foot{margin-top:auto;padding-top:16px;display:grid;gap:2px}
.uchip{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px}
.uchip b{display:block;font-size:14px}.uchip small{color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--p-soft);color:var(--p);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.main{flex:1;min-width:0}
.view{max-width:1360px;margin:0 auto;padding:26px 30px 48px}
.view.enter{animation:enter .28s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.bnav{display:none}
@media (max-width:959px){
  .side{display:none}
  .view{padding:0 0 96px}
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .bn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--faint);padding:4px 0;transition:color .15s}
  .bn.on{color:var(--p)}
  .bn.on .ic{animation:pop .3s var(--ease)}
  body.flow .bnav{display:none}
  body.flow .view{padding-bottom:24px}
}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* ===================== Encabezados ===================== */
.vhead{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.vhead h1{font-size:34px;font-weight:800;letter-spacing:-.035em}
.vhead p{margin:6px 0 0;color:var(--ink-2);font-size:16px}
.vhead .back{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--p-soft);color:var(--p);font-weight:700;font-size:13px;border-radius:99px;padding:6px 12px;white-space:nowrap}
.filters{display:flex;gap:12px;flex-wrap:wrap}
.fbox{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:10px 12px 12px;min-width:220px}
.fbox label{display:block;font-weight:700;font-size:13px;margin:0 0 6px 2px}
.selw{position:relative}
.selw select{appearance:none;width:100%;height:44px;border:1.5px solid var(--line);border-radius:var(--r-xs);background:#fff;padding:0 38px 0 40px;font-weight:600}
.selw select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--p-ring)}
.selw .ic.l{position:absolute;left:12px;top:13px;color:var(--ink-2);pointer-events:none}
.selw .ic.r{position:absolute;right:12px;top:13px;color:var(--ink-2);pointer-events:none}
.selw.plain select{padding-left:14px}

@media (max-width:959px){
  .vhead{position:sticky;top:0;z-index:20;background:rgba(240,245,252,.94);backdrop-filter:blur(14px);margin:0;padding:14px 16px 12px;align-items:center;flex-wrap:nowrap;gap:10px}
  .vhead h1{font-size:22px;letter-spacing:-.02em}
  .vhead p{font-size:13px;margin-top:2px}
  .vhead .back{display:grid;place-items:center;width:38px;height:38px;margin-left:-8px;border-radius:10px;color:var(--p)}
  .vhead .dsk{display:none}
  .filters{padding:0 16px 4px;gap:8px}
  .fbox{flex:1;min-width:0;padding:8px 10px 10px}
  .vbody{padding:12px 16px 0}
}

/* ===================== Superficies ===================== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:12px;padding:18px 20px 8px}
.card-h h2{font-size:19px;font-weight:800}
.card-b{padding:8px 20px 20px}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{display:flex;align-items:center;gap:16px;padding:20px;min-height:118px}
.kpi .tile{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none}
.kpi span.l{display:block;color:var(--ink-2);font-weight:600;font-size:14.5px}
.kpi b.v{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:2px;white-space:nowrap}
.kpi small{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--muted);font-size:12.5px}
.kpi .neg{color:var(--bad)}.kpi .pos{color:var(--ok)}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:700;border-radius:99px;padding:3px 9px;font-size:12px}
.delta.up{background:var(--ok-soft);color:var(--ok)}
.delta.down{background:var(--bad-soft);color:var(--bad)}
.tb{background:var(--p-soft);color:var(--p)}.tg{background:var(--ok-soft);color:var(--ok)}.to{background:#FFEDD5;color:#EA580C}.tp{background:#EDE9FE;color:#6D28D9}.tr{background:var(--bad-soft);color:var(--bad)}
.donut{margin-left:auto;position:relative;width:72px;height:72px;flex:none}
.donut svg{width:72px;height:72px}
.donut svg{transform:rotate(-90deg)}
.donut circle.v{animation:donut 1.1s var(--ease) both .15s}
@keyframes donut{from{stroke-dasharray:0 100}}
.donut b{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:16px}
.kpi.anim{animation:rise .45s var(--ease) both}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:959px){
  .kpis{gap:10px;margin-bottom:12px}
  .kpi{padding:14px;gap:10px;min-height:0;flex-wrap:wrap}
  .kpi .tile{width:40px;height:40px;border-radius:12px}
  .kpi .tile .ic{width:20px;height:20px}
  .kpi b.v{font-size:21px}
  .kpi small .vs{display:none}
  .donut{width:60px;height:60px;margin:0}
  .donut svg{width:60px;height:60px}
  .donut b{font-size:13px}
  .card-h{padding:16px 16px 6px}.card-h h2{font-size:17px}
  .card-b{padding:6px 16px 16px}
}

/* ===================== Tablas ===================== */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{background:var(--p-soft);color:var(--ink);font-weight:700;text-align:center;padding:11px 12px;white-space:nowrap}
.tbl th:first-child{text-align:left;border-radius:10px 0 0 0}
.tbl th:last-child{border-radius:0 10px 0 0}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:center;white-space:nowrap}
.tbl td:first-child{text-align:left}
.tbl td.b{font-weight:800}
.tbl td small{display:block;color:var(--muted);font-size:12px}
.tbl tr.tot td{background:var(--p-soft);font-weight:800;font-size:15.5px;border:0;padding:13px 12px}
.tbl tr.tot td:first-child{border-radius:0 0 0 10px}
.tbl tr.tot td:last-child{border-radius:0 0 10px 0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:not(.tot):hover td{background:#F8FBFF}
.tbl .dash{color:var(--faint)}
.tbl .neg{color:var(--bad);font-weight:700}.tbl .pos{color:var(--ok);font-weight:700}
.tbl tr.click{cursor:pointer}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl.left td,.tbl.left th{text-align:left}
.tbl.r td:not(:first-child),.tbl.r th:not(:first-child){text-align:right}

/* ===================== Gráficos ===================== */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-dasharray:3 4}
.chart .ax{fill:var(--muted);font-size:12px;font-weight:500}
.chart .ax2{fill:var(--ink-2);font-size:12.5px;font-weight:600}
.chart .val{fill:var(--ink);font-size:13px;font-weight:800}
.chart .bar{fill:var(--p);transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s var(--ease) both;animation-delay:var(--d,0s)}
.chart .bar.zero{fill:var(--line)}
.chart .val{animation:fadein .4s ease both;animation-delay:calc(var(--d,0s) + .45s)}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fadein{from{opacity:0}}
.chart .hit{fill:transparent}
.chart .col:hover .bar{fill:var(--p-600)}
.chart .col .guide{stroke:var(--ink-2);stroke-width:1;opacity:0;transition:opacity .12s}
.chart .col:hover .guide{opacity:.35}
.chart .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) forwards}
.chart .ln.s1{stroke:var(--p)}.chart .ln.s2{stroke:var(--s2);animation-delay:.2s}
.chart .area{fill:var(--p);opacity:.08;animation:fadein .8s ease both .5s}
.chart .pt{stroke:#fff;stroke-width:2;animation:fadein .3s ease both;animation-delay:var(--d,0s)}
.chart .pt.s1{fill:var(--p)}.chart .pt.s2{fill:var(--s2)}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;gap:18px;align-items:center;font-size:14px;font-weight:600;color:var(--ink-2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--head);color:#fff;font-size:13px;line-height:1.4;border-radius:10px;padding:8px 11px;box-shadow:0 10px 24px rgba(0,0,0,.18);opacity:0;transform:translate(-50%,calc(-100% - 12px));transition:opacity .1s;white-space:nowrap}
.tip.on{opacity:1}
.tip b{font-weight:800}

/* ===================== Botones y controles ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:12px;font-weight:700;white-space:nowrap;transition:background .15s,transform .1s,box-shadow .15s,border-color .15s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--p);color:#fff;box-shadow:0 8px 18px var(--p-ring)}
.btn-p:hover{background:var(--p-600)}
.btn-s{background:#fff;border:1.5px solid var(--p);color:var(--p)}
.btn-s:hover{background:var(--p-soft)}
.btn-g{color:var(--ink-2);height:40px;padding:0 12px}
.btn-g:hover{background:var(--line-2)}
.btn-lg{height:54px;font-size:16.5px;border-radius:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.6;pointer-events:none}
.link{color:var(--p);font-weight:700}
.link:hover{text-decoration:underline}
.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.field{margin-bottom:22px}
.field>label,.field>.lab{display:block;font-weight:700;font-size:16px;margin-bottom:10px}
.inpw{position:relative}
.inpw input{width:100%;height:54px;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:0 48px;font-size:17px;font-weight:600}
.inpw input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--p-ring)}
.inpw .ic.l{position:absolute;left:15px;top:16px;color:var(--ink-2)}
.inpw input::-webkit-calendar-picker-indicator{position:absolute;right:12px;width:28px;height:28px;opacity:.75;cursor:pointer}
.selw.big select{height:54px;border-radius:14px;font-size:17px;padding-left:16px}
.selw.big .ic.r{top:17px}

/* slider de días */
.days{position:relative;padding:8px 6px 0}
.days .rail{position:absolute;left:18px;right:18px;top:24px;height:4px;border-radius:4px;background:var(--line)}
.days .fill{position:absolute;left:18px;top:24px;height:4px;border-radius:4px;background:var(--p);transition:width .35s var(--ease)}
.days .dots{position:relative;display:flex;justify-content:space-between}
.days button{display:flex;flex-direction:column;align-items:center;gap:10px;width:36px;font-weight:600;font-size:16px;color:var(--ink-2)}
.days .d{width:14px;height:14px;border-radius:50%;background:var(--line);margin-top:10px;transition:all .3s var(--ease)}
.days button.in .d{background:var(--p)}
.days button.cur .d{width:34px;height:34px;margin-top:0;margin-bottom:-10px;background:var(--p);box-shadow:0 0 0 6px var(--p-ring);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.days button.cur{color:var(--p);font-weight:800}
.days button.cur span.n{visibility:hidden}
.days button.cur .d::after{content:attr(data-n)}
.note{display:flex;gap:14px;align-items:flex-start;background:var(--p-soft);border-radius:14px;padding:16px;color:var(--ink-2);margin-top:18px}
.note .ic{color:var(--p);margin-top:2px}
.note b{color:var(--ink)}

/* ===================== Inicio ===================== */

/* ===================== Mis proyecciones ===================== */

.wk{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,auto) 18px;gap:20px;align-items:center;padding:16px 18px;text-align:left;width:100%;border-bottom:1px solid var(--line-2)}

.succ{max-width:560px;margin:0 auto;text-align:center;padding-top:24px}

@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}

/* ===================== Productos / notificaciones / perfil ===================== */
.calc{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}

.sheet{position:fixed;z-index:51;left:50%;bottom:0;width:min(560px,100%);max-height:88vh;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;box-shadow:var(--sh-lg);padding:10px 20px calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,105%);transition:transform .38s var(--ease)}

.dnav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}

/* matriz en celular: todos los días juntos */
.swipe{display:flex;align-items:center;gap:6px;margin:12px 2px 0;font-size:12.5px;font-weight:600;color:var(--p)}
.mxm-card{margin-top:10px;padding:6px 0;overflow:hidden}
.mxm-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.mxm{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.mxm th,.mxm td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line-2);background:#fff}
.mxm thead th{background:var(--p-soft);font-weight:700;font-size:12px;white-space:nowrap;padding:9px 4px;border:0}
.mxm thead th small{display:block;color:var(--p);font-size:10.5px;font-weight:700}
.mxm thead th.bad{color:var(--bad)}
.mxm .stk{position:sticky;left:0;z-index:2;text-align:left;padding-left:12px;min-width:96px;max-width:96px;box-shadow:6px 0 8px -6px rgba(11,44,97,.18)}
.mxm thead .stk{background:var(--p-soft);z-index:3}
.mxm thead .stk small{color:var(--muted);font-weight:500}
.mxm td.stk b{display:block;font-size:13.5px}
.mxm td.stk small{color:var(--muted);font-size:10.5px}
.mxm .cell{width:52px;height:38px;border:1.5px solid var(--line);border-radius:10px;text-align:center;font-weight:700;font-size:15px;background:#fff}
.mxm .cell:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--p-ring)}
.mxm .cell.bad{border-color:#F3B3B4}
.mxm .ckg{display:block;color:var(--muted);font-size:10px;margin-top:2px;white-space:nowrap}
.mxm td{min-width:64px}
.mxm .tcol{min-width:60px;padding-right:12px}
.mxm td.tcol b{font-weight:800;font-size:14px}

.mxm tr.tot td{background:var(--p-soft);font-weight:800;border:0;padding:11px 4px}
.mxm tr.tot td.stk{font-size:12.5px;padding-left:12px}
.mxm tr.tot b{font-size:14px}
.msum{flex-wrap:wrap}
.mxm td small{white-space:nowrap}

   CONFIGURACIÓN
   - CATALOGO: categorías y productos con su peso por unidad.
     Agregar productos o categorías aquí no requiere tocar el diseño.
   - Datos: si la app se abre desde el servidor (npm start), todo se lee
     y se guarda en Azure SQL a través de /api. Si se abre como archivo
     suelto, funciona en modo demo y guarda solo en este navegador.
   ========================================================= */
const API = { on:false, base:'/api', info:null, err:null };
const ENV = { HORA_LIMITE:'10:00', TIMEOUT_MS:15000 };
async function apiFetch(path, opts={}){
  const ctl = new AbortController(), to = setTimeout(()=>ctl.abort(), ENV.TIMEOUT_MS);
  try{
    const r = await fetch(API.base+path, { method: opts.method||'GET', headers: opts.body?{'Content-Type':'application/json'}:{}, body: opts.body?JSON.stringify(opts.body):undefined, signal: ctl.signal, cache:'no-store' });
    let data = null; try{ data = await r.json(); }catch(e){}
    if (!r.ok){ const e = new Error((data&&data.error) || ('El servidor respondió '+r.status)); e.status = r.status; throw e; }
    return data;
  }catch(e){
    if (e.status) throw e;
    throw new Error(e.name==='AbortError' ? 'El servidor no respondió a tiempo.' : 'No se pudo conectar con el servidor.');
  }finally{ clearTimeout(to); }
}
async function detectApi(){
  API.on = false; API.info = null;
  if (!location.protocol.startsWith('http')){ API.err = 'La app se abrió como archivo, sin servidor.'; return; }
  try{
    const h = await apiFetch('/health'); API.info = h;
    if (h && h.db && h.tablas){ API.on = true; API.err = null; }
    else API.err = h && h.db ? 'Conectado a la base, pero faltan las tablas (ejecuta npm run db:init).' : ((h && h.error) || 'Sin conexión a la base de datos.');
  }catch(e){ API.err = e.message; }
}

/* ---------- marcas: isotipo de 3 aspas y mascota ---------- */
function isoPaths(){
  const C={x:50,y:52},R=46,rad=d=>d*Math.PI/180,qr=60,kr=30,qd=.32,rt=.5,bow=.08;
  const V=[0,1,2].map(i=>({x:C.x+R*Math.cos(rad(-90+120*i)),y:C.y+R*Math.sin(rad(-90+120*i))}));
  const L=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
  const RT=(p,d)=>{const a=rad(d),dx=p.x-C.x,dy=p.y-C.y;return{x:C.x+dx*Math.cos(a)-dy*Math.sin(a),y:C.y+dx*Math.sin(a)+dy*Math.cos(a)}};
  const M0=[0,1,2].map(i=>L(V[i],V[(i+1)%3],.5)),M=M0.map(m=>L(C,m,1+bow));
  const Q=M0.map(m=>RT(L(C,m,qd),qr)),K=M0.map(m=>RT(L(C,m,.6),kr));
  const f=p=>p.x.toFixed(2)+' '+p.y.toFixed(2);
  return [0,1,2].map(i=>{const pv=(i+2)%3,Mp=M[pv],P1=L(V[i],M0[pv],rt),P2=L(V[i],M0[i],rt),E1=L(Mp,P1,.5),E2=L(M[i],P2,.5);
    return `M${f(Mp)} Q${f(L(C,E1,1+bow*.6))} ${f(P1)} Q${f(V[i])} ${f(P2)} Q${f(L(C,E2,1+bow*.6))} ${f(M[i])} Q${f(K[i])} ${f(Q[i])} L${f(Q[pv])} Q${f(K[pv])} ${f(Mp)} Z`;});
}
const ISO = isoPaths(), DIRS = [[0,-5],[4.33,2.5],[-4.33,2.5]];
function isoMark(size, fill, gap, anim){
  return `<svg class="iso${anim?' anim':''}" width="${size}" height="${size}" viewBox="4 6 92 92" aria-hidden="true"><g class="spin">${ISO.map((d,i)=>`<path class="blade" style="--dx:${DIRS[i][0]}px;--dy:${DIRS[i][1]}px" d="${d}" fill="${fill}" stroke="${gap}" stroke-width="4.5" stroke-linejoin="round"/>`).join('')}</g></svg>`;
}

}

const pad = n => String(n).padStart(2,'0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = fromISO(s); d.setDate(d.getDate()+n); return toISO(d); };

const weekStart = s => { const d = fromISO(s), w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return toISO(d); };
const weekDates = ws => [0,1,2,3,4,5,6].map(i=>addDays(ws,i));
const dDM = s => { const d = fromISO(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const dShort = s => `${DOW[fromISO(s).getDay()]} ${dDM(s)}`;
const dFull = s => { const d = fromISO(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
const dDow = s => DOW[fromISO(s).getDay()];

}

const BASE = [
  [10,15,20,12,25,18,10,14,8,5],[8,12,18,10,20,15,8,12,6,4],[12,18,20,15,30,22,12,18,10,6],

];
function hash(str){ let h = 2166136261; for (const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h>>>0)%10000)/10000; }
function seedUnits(date, sellerF){
  const w = (fromISO(date).getDay()+6)%7, age = Math.max(0, Math.round((fromISO(TODAY)-fromISO(date))/DAY/7));
  const u = {}; CATALOGO.BRASA.forEach((p,i)=>{ u[p.id] = Math.max(0, Math.round(BASE[w][i]*sellerF*(1-0.03*age) + (hash(date+p.id+sellerF)-.5)*3)); }); return u;
}
const CUR_WS = weekStart(TODAY);
function seed(){
  const proj = {};
  for (let w=3; w>=0; w--){
    weekDates(addDays(CUR_WS, -7*w)).forEach(d=>{
      if (d >= TODAY) return;
      const t = 7 + Math.floor(hash(d+'h')*3), m = Math.floor(hash(d+'m')*60);
      proj[d] = { cat:'BRASA', units: seedUnits(d,1), status:'confirmada', at:`${d}T${pad(t)}:${pad(m)}`, by:ME.id };
    });
  }
  // borrador de hoy: pendiente
  proj[TODAY] = { cat:'BRASA', units: seedUnits(TODAY,1), status:'pendiente', at:null, by:ME.id };
  return proj;
}

/* ---------- consultas ---------- */
const prodsOf = cat => CATALOGO[cat] || [];
const prodById = id => Object.values(CATALOGO).flat().find(p=>p.id===id);
function kgOf(units){ let k = 0; for (const id in units){ const p = prodById(id); if (p) k += (+units[id]||0)*p.kg; } return k; }
const sumU = units => Object.values(units||{}).reduce((a,b)=>a+(+b||0),0);
// proyección de un vendedor en una fecha (los demás vendedores se simulan a partir del patrón)
function projOf(seller, date){
  if (API.on) return seller === ME.id ? (S.proj[date] || null) : ((S.remote[seller]||{})[date] || null);
  const mine = S.proj[date];
  if (seller === ME.id) return mine || null;
  const v = VENDEDORES.find(x=>x.id===seller); if (!mine) return null;
  return { cat:'BRASA', units: seedUnits(date, v.f), status: mine.status, at: mine.at, by: v.id };
}
// venta real (ERP) solo para días pasados confirmados
function realOf(p, date){
  if (!p || p.status!=='confirmada' || date >= TODAY) return null;
  const r = {}; for (const id in p.units){ const u = +p.units[id]||0; r[id] = Math.max(0, Math.round(u*(0.9 + hash(date+id+'r')*0.12))); } return r;
}
// agregado por día para el filtro de vendedor
function dayAgg(date, seller){
  const sel = seller==='all' ? VENDEDORES.map(v=>v.id) : [seller];
  let units = {}, real = null, status = null, any = false;
  sel.forEach(id=>{ const p = projOf(id, date); if (!p) return; any = true; status = p.status;
    for (const k in p.units) units[k] = (units[k]||0) + (+p.units[k]||0);
    const r = realOf(p, date); if (r){ real = real || {}; for (const k in r) real[k] = (real[k]||0) + r[k]; } });
  if (!any) return { date, units:{}, u:0, kg:0, status:'pendiente', real:null, has:false };
  const confirmed = status==='confirmada';
  return { date, units: confirmed?units:{}, u: confirmed?sumU(units):0, kg: confirmed?kgOf(units):0, status, real, has:true, cat:'BRASA' };
}
function weekAgg(ws, seller){ return weekDates(ws).map(d=>dayAgg(d, seller)); }
function weekOptions(){ return [0,1,2,3].map(i=>addDays(CUR_WS,-7*i)); }

function barChart(days, key='u', dW=760, dH=270){

  const y = v => T + ih - v/max*ih;
  let g = ''; for (let i=0;i<=4;i++){ const v = max*i/4; g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${nf0(v)}</text>`; }
  const cols = days.map((d,i)=>{ const cx = L + step*i + step/2, v = d[key], h = Math.max(v/max*ih, 3), x = cx-bw/2, top = T+ih-h, r = Math.min(6, h);
    const path = `M${x} ${T+ih} V${top+r} Q${x} ${top} ${x+r} ${top} H${x+bw-r} Q${x+bw} ${top} ${x+bw} ${top+r} V${T+ih} Z`;
    const tip = `<b>${dShort(d.date)}</b><br>${nf0(d.u)} unidades, ${nf1(d.kg)} kg<br>${d.status==='confirmada'?'Confirmada':'Pendiente'}`;
    return `<g class="col" data-tip="${esc(tip)}" data-act="openday" data-v="${d.date}" style="cursor:pointer"><rect class="hit" x="${L+step*i}" y="${T}" width="${step}" height="${ih}"/>
      <path class="bar ${v?'':'zero'}" style="--d:${i*.06}s" d="${path}"/><text class="val" style="--d:${i*.06}s" x="${cx}" y="${top-8}" text-anchor="middle">${nf0(v)}</text>
      <text class="ax2" x="${cx}" y="${H-B+20}" text-anchor="middle">${dDow(d.date)}${mob?'':' '+dDM(d.date)}</text>${mob?`<text class="ax" x="${cx}" y="${H-B+35}" text-anchor="middle">${dDM(d.date)}</text>`:''}</g>`; }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Unidades proyectadas por día">${g}<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="var(--line)"/>${cols}</svg></div>`;
}
function lineChart(days){
  const mob = isMobile(), W = mob?360:720, H = mob?250:330, L = mob?40:56, R = 14, T = 16, B = 44;
  const vals = days.flatMap(d=>[d.pk, d.rk].filter(v=>v!=null));
  const max = niceMax(Math.max(...vals,1)*1.05), iw = W-L-R, ih = H-T-B, step = iw/(days.length-1);
  const x = i => L + step*i, y = v => T + ih - v/max*ih;
  let g = ''; for (let i=0;i<=5;i++){ const v = max*i/5; g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${nf0(v)}</text>`; }
  const p1 = days.map((d,i)=>[x(i),y(d.pk)]), p2 = days.map((d,i)=>d.rk==null?null:[x(i),y(d.rk)]).filter(Boolean);
  const path = pts => pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = path(p1) + ` L${p1[p1.length-1][0]} ${T+ih} L${p1[0][0]} ${T+ih} Z`;
  const cols = days.map((d,i)=>{ const tip = `<b>${dShort(d.date)}</b><br>Proyección: ${nf1(d.pk)} kg<br>${d.rk==null?'Venta real: sin datos aún':`Venta real: ${nf1(d.rk)} kg<br>Diferencia: ${pct1((d.rk-d.pk)/d.pk*100)}`}`;
    return `<g class="col" data-tip="${esc(tip)}"><rect class="hit" x="${x(i)-step/2}" y="${T}" width="${step}" height="${ih}"/><line class="guide" x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${T+ih}"/>
      <text class="ax2" x="${x(i)}" y="${H-B+20}" text-anchor="middle">${dDow(d.date)}</text><text class="ax" x="${x(i)}" y="${H-B+35}" text-anchor="middle">${dDM(d.date)}</text></g>`; }).join('');
  const dots = (pts, c) => pts.map((p,i)=>`<circle class="pt ${c}" style="--d:${.25+i*.12}s" cx="${p[0]}" cy="${p[1]}" r="5"/>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilogramos proyectados y vendidos por día">${g}
    <path class="area" d="${area}"/>${cols}<path class="ln s1" pathLength="1" d="${path(p1)}"/>${p2.length>1?`<path class="ln s2" pathLength="1" d="${path(p2)}"/>`:''}${dots(p1,'s1')}${dots(p2,'s2')}</svg></div>`;
}

/* ---------- Envío y sincronización ----------
   Cada proyección confirmada se guarda primero en el dispositivo y luego
   se envía según APP_MODE. Si falla, queda en cola y se reintenta.        */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'p-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
function buildPayload(np, ds, id, sentAt){
  const prods = prodsOf(np.cat);
  const dias = ds.map(d=>({ fecha:d, total_unidades: sumU(np.units[d]), total_kg:+kgOf(np.units[d]).toFixed(2),
    productos: prods.map(p=>({ producto_id:p.id, producto:p.nombre, kg_por_unidad:p.kg, unidades:+np.units[d][p.id]||0, kg:+((+np.units[d][p.id]||0)*p.kg).toFixed(2) })) }));
  return { id, tipo:'proyeccion', origen:'app-web', enviado_en: sentAt,
    vendedor:{ usuario:ME.id, nombre:ME.nombre, zona:ME.zona },
    categoria: np.cat, fecha_inicio: np.start, dias: np.days,
    total_unidades: dias.reduce((s,d)=>s+d.total_unidades,0), total_kg:+dias.reduce((s,d)=>s+d.total_kg,0).toFixed(2),
    detalle: dias,
    filas: dias.flatMap(d=>d.productos.map(p=>({ proyeccion_id:id, fecha:d.fecha, categoria:np.cat, producto_id:p.producto_id, unidades:p.unidades, kg:p.kg }))) };
}
async function postJSON(body){ if (!API.on) throw new Error('local'); return apiFetch('/proyecciones', { method:'POST', body }); }
const queue = () => store.get('nv_queue', []);
function setSync(dates, sync, err){ dates.forEach(d=>{ if (S.proj[d]){ S.proj[d].sync = sync; S.proj[d].err = err||null; } }); saveProj(); }
async function flushQueue(silent){
  if (!API.on) return 0;
  let q = queue(), ok = 0; if (!q.length) return 0;
  const rest = [];
  for (const item of q){
    try{ await postJSON(item.payload); ok++; setSync(item.dates,'ok'); }
    catch(e){ rest.push(item); setSync(item.dates,'pendiente', e.message); }
  }
  store.set('nv_queue', rest);
  if (ok && API.on){ try{ await loadRemote(); }catch(e){} }
  if (!silent){ toast(ok ? `${ok} ${ok===1?'envío sincronizado':'envíos sincronizados'}${rest.length?`, ${rest.length} pendiente(s)`:''}` : 'No se pudo sincronizar. Se intentará de nuevo.'); }
  if (S.session) render({keepScroll:true});
  return ok;
}
async function sendNP(){
  closeSheet();
  const np = S.np, ds = npDates(), now = new Date(), at = `${toISO(now)}T${pad(now.getHours())}:${pad(now.getMinutes())}`, id = uid();
  const ov = $('#overlay'); ov.innerHTML = `<div class="inner">${mark(isRocio()?64:92,false,true,true)}<span>${!API.on?'Guardando proyección':'Enviando proyección'}</span></div>`; ov.classList.add('on');
  const payload = buildPayload(np, ds, id, now.toISOString());
  ds.forEach(d=>{ const u = {}; prodsOf(np.cat).forEach(p=>u[p.id] = +np.units[d][p.id]||0); S.proj[d] = { id, cat:np.cat, units:u, status:'confirmada', at, by:ME.id, sync: !API.on?'local':'pendiente' }; });
  saveProj();
  let res = { sync:'local', err:null };
  const t0 = Date.now();
  if (API.on){
    try{ await postJSON(payload); res.sync = 'ok'; }
    catch(e){ res = { sync:'pendiente', err:e.message }; store.set('nv_queue', [...queue().filter(x=>x.id!==id), { id, dates:ds, payload }]); }
    setSync(ds, res.sync, res.err);
  }
  await new Promise(r=>setTimeout(r, Math.max(0, 1200-(Date.now()-t0))));
  S.last = { start:np.start, days:np.days, cat:np.cat, dates:ds, ...res }; S.np = null; store.del('nv_np');
  ov.classList.remove('on'); S.view = 'success'; render(); if (res.sync!=='pendiente') confetti();
}
function syncBadge(p){
  if (!p || p.status!=='confirmada') return '';
  const m = { ok:['Sincronizada','b-ok','check'], pendiente:['Por sincronizar','b-warn','refresh'], local:['En este dispositivo','b-pend','box'] }[p.sync||'local'];
  return `<span class="badge ${m[1]}" title="${esc(p.err||'')}"><span class="bi">${ic(m[2],12,2.6)}</span>${m[0]}</span>`;
}

function confetti(){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const c = document.createElement('div'); c.className = 'confetti';
  const cols = isRocio()?['#E2231A','#1F1D1B','#F59E0B','#12A150']:['#1570EF','#FBBB21','#12A150','#0B2C61','#F97316'];
  c.innerHTML = [...Array(46)].map((_,i)=>`<i style="left:${Math.random()*100}%;background:${cols[i%cols.length]};--x:${(Math.random()-.5)*160}px;--r:${Math.random()*720-360}deg;animation-delay:${Math.random()*.35}s"></i>`).join('');
  document.body.appendChild(c); setTimeout(()=>c.remove(), 2400);
}

      <section class="card"><div class="card-h"><h2 class="grow">Desviación por producto (semana)</h2></div><div class="tscroll" style="padding:0 12px 14px">
        ${withReal.length?`<table class="tbl" style="font-size:13.5px"><thead><tr><th>Producto</th><th>Proyección<br>(kg)</th><th>Venta real<br>(kg)</th><th>Dif. (kg)</th><th>Dif. (%)</th></tr></thead><tbody>${prow}
        <tr class="tot"><td>Total</td><td>${nf1(P)}</td><td>${nf1(R)}</td><td class="${R<P?'neg':'pos'}">${nf1(R-P)}</td><td class="${dev<0?'neg':'pos'}">${pct1(dev)}</td></tr></tbody></table>`:'<div class="empty"><b>Sin ventas registradas</b>Esta semana aún no tiene ventas del ERP.</div>'}</div></section>
    </div></div></div>`;
};
VIEWS['dash-est'] = () => {
  const a = weekAgg(S.week, S.seller), u = a.reduce((s,d)=>s+d.u,0), k = a.reduce((s,d)=>s+d.kg,0);
  const legend = `<div class="legend"><span class="row" style="gap:8px"><span class="badge b-ok" style="padding:0;background:none"><span class="bi" style="width:24px;height:24px">${ic('check',14,3)}</span></span>Confirmada</span><span class="row" style="gap:8px"><span class="badge b-pend" style="padding:0;background:none"><span class="bi" style="width:24px;height:24px">${ic('clock',14,2.5)}</span></span>Pendiente</span></div>`;
  return `<div>${vhead('Estado de proyecciones', weekLabel(S.week,true), filtersHTML(), 'home')}${isMobile()?filtersHTML():''}${dtabs()}
    <div class="vbody"><div class="estleg">${legend}</div>
    <div class="dcards">${a.map((d,i)=>`<button class="dc" data-act="openday" data-v="${d.date}" data-tip="${esc(`<b>${dShort(d.date)}</b><br>${d.status==='confirmada'?`${nf0(d.u)} unid., ${nf1(d.kg)} kg`:'Pendiente'}`)}"><b>${dDow(d.date)}</b><span>${dDM(d.date)}</span><span class="st ${d.status==='confirmada'?'ok':'pend'}" style="--d:${i*.08}s">${ic(d.status==='confirmada'?'check':'clock',28,3)}</span><small>${d.status==='confirmada'?'Confirmada':'Pendiente'}</small></button>`).join('')}</div>
    <div class="dsplit eq">
      <section class="card"><div class="card-h"><h2 class="grow">Total proyectado por día (unidades)</h2></div><div class="card-b">${barChart(a,'u',560,330)}</div></section>
      <section class="card"><div class="card-h"><h2 class="grow">Detalle por día (unidades y kg)</h2></div><div class="tscroll" style="padding:0 12px 14px"><table class="tbl"><thead><tr><th>Fecha</th><th>Unidades</th><th>Kilos (aprox.)</th><th>Estado</th></tr></thead>
        <tbody>${a.map(d=>`<tr class="click" data-act="openday" data-v="${d.date}"><td>${dDow(d.date)} ${dFull(d.date)}</td><td>${nf0(d.u)}</td><td>${d.u?nf1(d.kg):'<span class="dash">-</span>'}</td><td style="text-align:left">${badge(d.status)}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td>${nf0(u)}</td><td>${nf1(k)}</td><td>-</td></tr></tbody></table></div></section>
    </div></div></div>`;
};

/* ---------- Productos ---------- */
VIEWS.products = () => {
  const cat = S.prodCat || 'BRASA', prods = prodsOf(cat), sel = prodById(S.calcP) && prodsOf(cat).find(p=>p.id===S.calcP) ? S.calcP : prods[0].id, sp = prodById(sel), cu = S.calcU ?? 10;
  return `<div>${vhead('Productos','Presentaciones y conversión de unidades a kilos.','', 'home')}<div class="vbody">
    <div class="seg" style="margin-bottom:14px">${Object.keys(CATALOGO).map(c=>`<button class="${cat===c?'on':''}" data-act="prodcat" data-v="${c}">${c}</button>`).join('')}</div>
    <div class="dsplit">
    <section class="card"><div class="card-h"><h2 class="grow">Calculadora</h2></div><div class="card-b">
      <div class="calc"><div><label class="lab" for="cp" style="font-weight:700;display:block;margin-bottom:6px">Producto</label><div class="selw plain" style="width:170px"><select id="cp">${prods.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${p.nombre}</option>`).join('')}</select>${ic('chev',18).replace('class="ic"','class="ic r"')}</div></div>
        <div><label for="cu" style="font-weight:700;display:block;margin-bottom:6px">Unidades</label><div class="inpw"><input id="cu" inputmode="numeric" value="${cu}" style="height:44px;font-size:16px"></div></div>
        <div><small class="muted" style="font-weight:600">Equivale a</small><div class="res" id="cres">${nf1((+cu||0)*sp.kg)} kg</div></div></div>
      <p class="muted" style="font-size:13px;margin:14px 0 0">${sp.nombre} pesa ${sp.kg.toFixed(2)} kg por unidad, en promedio.</p></div></section>
    <section class="card"><div class="card-h"><h2 class="grow">Catálogo ${cat}</h2><span class="muted">${prods.length} productos</span></div><div style="padding:0 12px 14px"><table class="tbl r"><thead><tr><th>Producto</th><th>Kg por unidad</th><th>10 unidades</th></tr></thead>
      <tbody>${prods.map(p=>`<tr><td>${p.nombre}</td><td>${p.kg.toFixed(2)}</td><td>${nf1(p.kg*10)} kg</td></tr>`).join('')}</tbody></table></div></section>
    </div></div></div>`;
};

/* ---------- Notificaciones ---------- */
const NOTIF = [
  ['alert','tr','Proyección pendiente', ()=>`Tu proyección de hoy (${dShort(TODAY)}) aún no está confirmada.`, 'Hace 1 h'],
  ['cart','tg','Ventas del ERP actualizadas', ()=>`Ya puedes comparar la venta real de ${dShort(addDays(TODAY,-1))}.`, 'Hace 3 h'],
  ['chart','tb','Resumen semanal disponible', ()=>`La semana del ${weekLabel(addDays(CUR_WS,-7))} cerró con buena exactitud.`, 'Lunes'],
  ['box','tp','Catálogo actualizado', ()=>'Se agregó la categoría BROASTER con 6 presentaciones.', 'Hace 5 d']
];
VIEWS.notif = () => `<div>${vhead('Notificaciones', '', S.unread.length?`<button class="btn btn-g" data-act="readall">${ic('check',18)} Marcar todo como leído</button>`:'', 'home')}<div class="vbody">
  <section class="card nl">${NOTIF.map(([i,c,t,p,w],k)=>`<button class="nt ${S.unread.includes(k)?'unread':''}" data-act="notif" data-v="${k}"><span class="tile ${c}">${ic(i)}</span><span><b>${t}</b><p>${p()}</p></span><small>${w}</small></button>`).join('')}</section></div></div>`;

/* ---------- Perfil ---------- */
VIEWS.profile = () => `<div>${vhead('Perfil','', '', 'home')}<div class="vbody" style="max-width:720px">
  <section class="card prof" style="margin-bottom:14px"><div class="avatar">${initials()}</div><div><b>${ME.nombre}</b><span class="muted">Vendedor, ${ME.zona}</span></div></section>
  <section class="card">
    <div class="opt"><span class="tile tb">${ic('layers')}</span><span class="grow"><b>Marca de la app</b><small>Cambia los colores y el logo</small></span><div class="bsw" role="group" aria-label="Marca">${Object.entries(BRANDS).map(([k,b])=>`<button class="${S.brand===k?'on':''}" data-act="brand" data-v="${k}">${b.name}</button>`).join('')}</div></div>
    <button class="opt" data-act="go" data-v="conexion"><span class="tile tg">${ic('send')}</span><span class="grow"><b>Conexión</b><small>${MODE_TXT()}${queue().length?`, ${queue().length} por sincronizar`:''}</small></span>${ic('right',18)}</button>
${API.on?'':`<button class="opt" data-act="reset"><span class="tile to">${ic('refresh')}</span><span class="grow"><b>Restablecer datos de ejemplo</b><small>Vuelve a cargar la semana de prueba</small></span>${ic('right',18)}</button>`}
    <button class="opt" data-act="logout"><span class="tile tr">${ic('logout')}</span><span class="grow"><b>Cerrar sesión</b><small>Volver a la pantalla de inicio de sesión</small></span>${ic('right',18)}</button>
  </section></div></div>`;

/* ---------- Conexión ---------- */
VIEWS.conexion = () => {
  const q = queue().length, h = API.info || {};
  const st = API.on ? `<div class="note" style="background:var(--ok-soft);margin:0">${ic('check',22)}<div><b>Conectado a la base de datos.</b><br>Las proyecciones se guardan en ${esc(h.base||'')}${h.esquema?' ('+esc(h.esquema)+')':''}${h.modo==='memoria'?', modo de prueba en memoria (se borra al reiniciar el servidor)':''}.</div></div>`
    : `<div class="note warn" style="margin:0">${ic('alert',22)}<div><b>Sin conexión a la base de datos.</b><br>${esc(API.err||'')}<br>Mientras tanto, la app guarda solo en este navegador.</div></div>`;
  return `<div>${vhead('Conexión','Dónde se guardan las proyecciones.','', 'profile')}<div class="vbody" style="max-width:760px">
  <section class="card" style="margin-bottom:14px"><div class="card-b" style="padding-top:18px;display:grid;gap:14px">${st}
    ${API.on?`<div class="sum">
      <div class="it">${ic('layers')}<span>Base de datos</span><b>${esc(h.base||'-')}</b></div>
      <div class="it">${ic('send')}<span>Servidor</span><b style="word-break:break-all">${esc(h.servidor||'-')}</b></div>
      <div class="it">${ic('user')}<span>Sesión</span><b>${esc(ME.nombre)}<small>${esc(ME.id)}</small></b></div></div>`:''}
    <div class="row" style="flex-wrap:wrap;gap:10px"><button class="btn btn-s" data-act="apitest">${ic('refresh',18)} Probar conexión</button>${q?`<button class="btn btn-p" data-act="flush">${ic('send',18)} Enviar ${q} pendiente(s)</button>`:''}${API.on?`<button class="btn btn-g" data-act="reload">${ic('refresh',18)} Recargar datos</button>`:''}</div>
  </div></section>
  <section class="card"><div class="card-b" style="padding-top:18px;font-size:14px;color:var(--ink-2)">
    <b style="color:var(--ink);font-size:15px">Cómo conectar la base de datos</b>
    <ol style="margin:8px 0 0;padding-left:20px;display:grid;gap:4px"><li>Copia <code>.env.example</code> como <code>.env</code> y coloca las credenciales de Azure SQL.</li><li>Ejecuta <code>npm install</code> y luego <code>npm run db:init</code> (crea las tablas).</li><li>Inicia con <code>npm start</code> y abre <code>http://localhost:3000</code>.</li><li>Para ver lo guardado: <code>npm run db:ver</code>.</li></ol>
    <p style="margin:10px 0 0">La venta real (ERP) de los dashboards todavía es simulada; las proyecciones sí son reales.</p></div></section></div></div>`;
};

/* =========================================================
   Comportamiento
   ========================================================= */
function afterRender(){
  const mob = isMobile();
  document.querySelectorAll('.m-only-inline').forEach(e=>e.style.display = mob?'':'none');
  document.querySelectorAll('.d-only-inline').forEach(e=>e.style.display = mob?'none':'');
  document.querySelectorAll('.d-only-card').forEach(e=>e.style.display = mob?'none':'');
  if (!mob){ const h = document.querySelector('.hero'); if (h) h.style.display='none'; const g = document.querySelector('.greet'); if (g){ g.style.margin='0 0 4px'; g.style.padding='0'; g.style.background='none'; } }
  if (S.view==='new' && S.np && S.np.step===1) updateGrid();
}
function openSheet(html){ $('#sheet').innerHTML = html; $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); setTimeout(()=>$('#sheet button.btn-p')?.focus(), 350); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
function toast(t){ const el = $('#toast'); el.innerHTML = ic('check',16,2.5) + esc(t); el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('on'), 2000); }
function go(v){
  if (v==='new' && (!S.np || S.view==='success')) S.np = S.np && S.view!=='success' ? S.np : newNP();
  S.view = v; render();
}
function fillExample(){
  const np = S.np; npDates().forEach(d=>{ const w = (fromISO(d).getDay()+6)%7; np.units[d] = {};
    prodsOf(np.cat).forEach((p,i)=>{ np.units[d][p.id] = Math.max(1, Math.round((BASE[w][i % 10] || 8) * (np.cat==='BRASA'?1:.7) + (Math.random()-.5)*4)); }); });
  saveNP(); render({keepScroll:true}); document.querySelectorAll('.mx .cell').forEach((c,i)=>{ setTimeout(()=>{ c.classList.add('flash'); setTimeout(()=>c.classList.remove('flash'),300); }, i*8); });
  toast('Tabla rellenada con datos de ejemplo');
}

function exportCSV(){
  const rows = [['proyeccion_id','fecha','dia','categoria','producto_id','producto','kg_por_unidad','unidades','kg','estado','sincronizacion','enviado']];
  Object.keys(S.proj).sort().forEach(d=>{ const p = S.proj[d]; if (!p || p.status!=='confirmada') return;
    prodsOf(p.cat).forEach(pr=>{ const u = +p.units[pr.id]||0; rows.push([p.id||'', d, dDow(d), p.cat, pr.id, pr.nombre, pr.kg.toFixed(2), u, (u*pr.kg).toFixed(2), p.status, p.sync||'local', p.at||'']); }); });
  const csv = rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})); a.download = `proyecciones_${TODAY}.csv`; document.body.appendChild(a); a.click(); a.remove();
  toast(`CSV descargado (${rows.length-1} filas)`);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  if (a==='go') go(v);
  else if (a==='soon') toast('Disponible en una próxima versión');
  else if (a==='forgot') toast('Pide a tu supervisor que restablezca tu contraseña.');
  else if (a==='flush') flushQueue(false);
  else if (a==='exportcsv') exportCSV();
  else if (a==='apitest'){ detectApi().then(()=>{ render({keepScroll:true}); toast(API.on?'Conexión correcta':'Sin conexión'); }); }
  else if (a==='reload'){ loadRemote().then(()=>{ render({keepScroll:true}); toast('Datos actualizados desde la base'); }).catch(e=>toast(e.message)); }
  else if (a==='eye'){ const i = $('#lp'), show = i.type==='password'; i.type = show?'text':'password'; t.innerHTML = ic(show?'eye':'eyeoff'); }
  else if (a==='togglenav'){ S.navOpen = !S.navOpen; renderChrome(); }
  else if (a==='logout'){ S.session = null; S.loginErr = false; store.del('nv_session'); renderLogin(); }
  else if (a==='days'){ S.np.days = +v; S.np.units = {}; saveNP(); render({keepScroll:true}); }
  else if (a==='np-next'){ S.np.step = 1; S.np.tried = false; ensureUnits(); saveNP(); render(); }
  else if (a==='np-back'){ S.np.step = 0; saveNP(); render(); }
  else if (a==='np-fill') fillExample();
  else if (a==='npday'){ S.np.dayIdx = +v; saveNP(); render({keepScroll:true}); const c = document.querySelector('.dchip.on'); c && c.scrollIntoView({inline:'center',block:'nearest'}); }
  else if (a==='npstep'){ const [d,id] = v.split('|'); const n = Math.max(0,(+S.np.units[d][id]||0) + (+t.dataset.d)); S.np.units[d][id] = n; saveNP(); const inp = document.querySelector(`[data-cell="${v}"]`); if (inp) inp.value = n; updateGrid(); }
  else if (a==='npcopy'){ const ds = npDates(), i = S.np.dayIdx; S.np.units[ds[i]] = {...S.np.units[ds[i-1]]}; saveNP(); render({keepScroll:true}); toast('Copiado de '+dShort(ds[i-1])); }
  else if (a==='np-review') openReview();
  else if (a==='np-send') sendNP();
  else if (a==='closesheet') closeSheet();
  else if (a==='openday'){ S.detail = v; S.view = 'detail'; render(); }
  else if (a==='editday'){ S.np = newNP(v); S.np.days = 1; S.np.cat = (S.proj[v]&&S.proj[v].cat)||'BRASA'; S.np.step = 1; ensureUnits(); saveNP(); S.view = 'new'; render(); }
  else if (a==='minetab'){ S.mineTab = v; render({keepScroll:true}); }
  else if (a==='histweek'){ S.week = v; S.seller = ME.id; S.view = 'dash-vs'; render(); }
  else if (a==='prodcat'){ S.prodCat = v; S.calcP = null; render({keepScroll:true}); }
  else if (a==='notif'){ S.unread = S.unread.filter(x=>x!==+v); store.set('nv_notif', S.unread); if (+v===0){ S.detail = TODAY; S.view='detail'; } else if (+v===1){ S.view='dash-vs'; } else if (+v===2){ S.week = addDays(CUR_WS,-7); S.view='dash-res'; } else { S.view='products'; S.prodCat='BROASTER'; } render(); }
  else if (a==='readall'){ S.unread = []; store.set('nv_notif', []); render({keepScroll:true}); toast('Notificaciones marcadas como leídas'); }
  else if (a==='brand'){ S.brand = v; store.set('nv_brand', v); document.documentElement.dataset.brand = v; showSplash(1.4); render({keepScroll:true}); }
  else if (a==='reset'){ ['nv_proj','nv_seed_v1','nv_np','nv_notif','nv_queue'].forEach(store.del); location.reload(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.cell){ const [d,id] = t.dataset.cell.split('|'); t.value = t.value.replace(/\D/g,'').slice(0,4); S.np.units[d][id] = t.value===''?'':+t.value; saveNP(); updateGrid();
    if (S.np.tried && sumU(S.np.units[d])>0) document.querySelectorAll(`[data-cell^="${d}|"]`).forEach(c=>c.classList.remove('bad')); }
  if (t.id==='cu'){ S.calcU = t.value.replace(/\D/g,''); t.value = S.calcU; const p = prodById($('#cp').value); $('#cres').textContent = nf1((+S.calcU||0)*p.kg)+' kg'; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id==='np-start'){ if (!t.value || t.value < TODAY){ t.value = S.np.start; toast('Elige hoy o una fecha futura'); return; } S.np.start = t.value; S.np.units = {}; saveNP(); render({keepScroll:true}); }
  if (t.id==='np-cat'){ S.np.cat = t.value; S.np.units = {}; saveNP(); render({keepScroll:true}); }
  if (t.id==='fw'){ S.week = t.value; render({keepScroll:true}); }
  if (t.id==='fs'){ S.seller = t.value; render({keepScroll:true}); }
  if (t.id==='cp'){ S.calcP = t.value; render({keepScroll:true}); }
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape') closeSheet();
  // navegación tipo hoja de cálculo en la matriz
  const t = e.target; if (!t.dataset || !t.dataset.cell) return;
  if (['Enter','ArrowDown','ArrowUp'].includes(e.key)){
    const cells = [...document.querySelectorAll('.mx .cell')], cols = S.np.days, i = cells.indexOf(t);
    const j = e.key==='ArrowUp' ? i-cols : i+cols; if (cells[j]){ e.preventDefault(); cells[j].focus(); cells[j].select(); }
  }
});
// tooltips
const tip = $('#tip');
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (!t){ tip.classList.remove('on'); return; } tip.innerHTML = t.dataset.tip; tip.classList.add('on'); });
document.addEventListener('mousemove', e => { if (tip.classList.contains('on')){ tip.style.left = e.clientX+'px'; tip.style.top = e.clientY+'px'; } });
let lastMob = isMobile();
addEventListener('resize', () => { const m = isMobile(); if (m!==lastMob && S.session){ lastMob = m; render({keepScroll:true}); } });

/* ---------- pantalla de carga ---------- */
function showSplash(dur=2.2){
  const sp = $('#splash');
  const rings = [420,640,880].map(s=>`<span class="ring" style="width:${s}px;height:${s}px;left:50%;top:50%;margin:-${s/2}px 0 0 -${s/2}px"></span>`).join('');
  sp.innerHTML = `${rings}<div class="inner">${mark(isRocio()?92:128,true,true,true)}<div class="bname">${isRocio()?'Grupo Rocío':'Noraves'}</div><div class="tag">Planificación de Demanda</div><div class="bar" style="--dur:${dur}s"><i></i></div></div>`;
  sp.classList.remove('hide'); clearTimeout(sp._t); sp._t = setTimeout(()=>sp.classList.add('hide'), dur*1000+150);
}
/* ---------- datos desde Azure SQL ---------- */
async function loadRemote(){
  const desde = addDays(CUR_WS,-21), hasta = addDays(CUR_WS,13);
  const [cat, vend, prs] = await Promise.all([apiFetch('/catalogo'), apiFetch('/vendedores'), apiFetch(`/proyecciones?desde=${desde}&hasta=${hasta}`)]);
  if (cat && cat.length){ for (const k in CATALOGO) delete CATALOGO[k]; cat.forEach(p=>{ (CATALOGO[p.categoria] = CATALOGO[p.categoria] || []).push({ id:p.id, nombre:p.nombre, kg:+p.kg_por_unidad }); }); }
  VENDEDORES.length = 0; (vend||[]).forEach(v=>VENDEDORES.push({ id:v.usuario, nombre:v.nombre, zona:v.zona, f:1 }));
  const pend = {}; Object.entries(S.proj||{}).forEach(([d,p])=>{ if (p && p.sync==='pendiente') pend[d] = p; });
  S.remote = {};
  (prs||[]).forEach(p=>{ const dt = new Date(p.enviado_en), at = `${toISO(dt)}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
    (S.remote[p.usuario] = S.remote[p.usuario] || {})[p.fecha] = { id:p.envio_id, cat:p.categoria, units:p.unidades, status:p.estado, at, by:p.usuario, sync:'ok' }; });
  S.proj = { ...(S.remote[ME.id] || {}), ...pend };
  if (!CATALOGO[S.dashCat]) S.dashCat = Object.keys(CATALOGO)[0];
}
async function boot(){
  if (API.on){
    if (!S.session || !S.session.vend){ S.session = null; store.del('nv_session'); renderLogin(); return; }
    Object.assign(ME, { id:S.session.vend.usuario, nombre:S.session.vend.nombre, zona:S.session.vend.zona });
    try{ await loadRemote(); }catch(e){ toast('No se pudieron leer los datos: '+e.message); }
  }
  $('#login').innerHTML = ''; $('#app').classList.remove('hide'); $('#bnav').classList.remove('hide'); render();
}
document.documentElement.dataset.brand = S.brand;
showSplash(2.2);
addEventListener('online', ()=>flushQueue(false));
detectApi().finally(()=>{ if (S.session) boot(); else renderLogin(); setTimeout(()=>flushQueue(true), 2500); });
</script>
