# Publica una versión de la app al crear un tag (git tag v1.2.0 && git push origin v1.2.0):
# - Android: APK firmado (noraves.apk). La web lo enlaza con releases/latest/download/noraves.apk.
# - iOS: .ipa sin firmar (para instalar con Sideloadly/AltStore; ver mobile/README.md).
# Requiere los Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y
# ANDROID_KEY_PASSWORD (mobile/README.md explica cómo crearlos).
name: Mobile release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (p. ej. 1.2.0). Crea el tag v<versión>."
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          raw="${INPUT:-$REF}"
          name="${raw#v}"
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versión inválida '$raw'. Usa el formato v1.2.3."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Clave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Falta el Secret ANDROID_KEYSTORE_BASE64 (ver mobile/README.md, sección Publicar)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Pruebas
        run: ./gradlew :shared:jvmTest --console=plain
      - name: APK firmado
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionCode crece con cada ejecución: Android solo actualiza a un código mayor.
          ./gradlew :androidApp:assembleRelease --console=plain \
            -Pavicola.versionName=${{ needs.version.outputs.name }} \
            -Pavicola.versionCode=$((100 + GITHUB_RUN_NUMBER))
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$RUNNER_TEMP/noraves.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$RUNNER_TEMP/noraves.apk" | head -n 3
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ${{ runner.temp }}/noraves.apk

  ios:
    needs: version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Versión
        run: |
          sed -i '' "s/^avicola.versionName=.*/avicola.versionName=${{ needs.version.outputs.name }}/" gradle.properties
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: \"${{ needs.version.outputs.name }}\"/" iosApp/project.yml
      - name: Compilar .ipa sin firmar
        working-directory: mobile/iosApp
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 40
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Noraves.app Payload/
          zip -qry "$RUNNER_TEMP/noraves-ios-sin-firmar.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: ${{ runner.temp }}/noraves-ios-sin-firmar.ipa

  publish:
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Noraves ${{ needs.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/noraves.apk
            dist/noraves-ios-sin-firmar.ipa
          body: |
            **Android:** descarga `noraves.apk` y ábrelo. Android pedirá permitir instalar apps de esta fuente.
            **iPhone:** usa la app web (Safari → Compartir → Agregar a inicio), o instala el `.ipa` con Sideloadly/AltStore (ver `mobile/README.md`).
