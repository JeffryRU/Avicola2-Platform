[project]
name = "avicola2-backend"
version = "0.1.0"
description = "Backend de la plataforma de planificación de saca de Avícola 2"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "deltalake>=1.6.6",
    "fastapi[standard]>=0.143.2",
    "holidays>=0.106",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
