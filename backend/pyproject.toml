[project]
name = "avicola2-backend"
version = "0.1.0"
description = "Backend de la plataforma de planificación de saca de Avícola 2"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "deltalake>=1.6.6",
    "fastapi[standard]>=0.143.2",
    "fpdf2>=2.8",
    "holidays>=0.106",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=5",
    "scikit-learn>=1.5",
    "sqlalchemy>=2",
]

[project.optional-dependencies]
azure = [
    "pymssql>=2.4.6",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "hypothesis>=6.170.15",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "schemathesis>=4.33.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear: errores probables
    "A",        # no tapar builtins
    "C4",       # comprensiones
    "SIM",      # simplificaciones
    "RET",      # returns
    "PIE",      # misc
    "PERF",     # rendimiento
    "PTH",      # pathlib en vez de os.path
    "DTZ",      # datetimes con zona horaria
    "S",        # bandit: seguridad
    "BLE",      # except Exception ciego
    "T20",      # sin print (usar logging)
    "LOG", "G", # buen uso de logging
    "ERA",      # código comentado
    "ARG",      # argumentos sin usar
    "ISC",      # concatenación implícita de strings
    "TID",      # imports: sin relativos
    "PT",       # pytest
    "PL",       # pylint
    "ASYNC",    # async
    "FAST",     # FastAPI
    "RUF",      # reglas propias de Ruff
]
ignore = [
    "PLR0913", "PLR0917",  # los casos de uso reciben sus puertos por constructor
    "RUF001", "RUF002", "RUF003",  # textos en español (×, «», tildes) no son ambiguos
    "PT018",  # se permite `assert a and b` en las pruebas
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "PLR2004", "PLC0415", "ARG001", "DTZ001"]
# El fixture `db` se importa de adv_support y se recibe como parámetro (patrón de pytest).
"tests/adversarial/**" = ["F811"]
# Comandos de consola: imprimen en pantalla y generan datos de ejemplo.
"app/**/cli.py" = ["T201", "S311", "PLR2004"]
"../scripts/**" = ["T201", "S311", "DTZ011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "fuzz: fuzzing y máquinas de estados de Hypothesis (lentos; job aparte en CI, FUZZ_EXAMPLES)",
]
