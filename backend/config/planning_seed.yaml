# Datos maestros de la app de planificación ("TABLAS MAESTRAS PARA APP.xlsx" de Avícola 2).
# `python -m app.planning.infrastructure.cli init` los carga o actualiza; los productos que ya
# no están aquí se desactivan (no se borran: las proyecciones antiguas los siguen citando).
# `subcategory` agrupa la tabla de proyección (Brasa chica/mediana/grande); la proyección es por
# categoría, como en el mockup. Los grupos son los del negocio al pedir a granja: chica = rangos
# B0–B4 (Brasa 1–5), mediana = B5–B6 (Brasa 6–7), grande = B7–B9 (Brasa 8–10). `kg_per_unit` es la columna «Peso» (kg por unidad, promedio).

products:
  BRASA:
    - {id: P0001, name: Brasa 1, subcategory: Brasa chica, kg_per_unit: 1.0}
    - {id: P0002, name: Brasa 2, subcategory: Brasa chica, kg_per_unit: 1.2}
    - {id: P0003, name: Brasa 3, subcategory: Brasa chica, kg_per_unit: 1.3}
    - {id: P0004, name: Brasa 4, subcategory: Brasa chica, kg_per_unit: 1.4}
    - {id: P0005, name: Brasa 5, subcategory: Brasa chica, kg_per_unit: 1.5}
    - {id: P0006, name: Brasa 6, subcategory: Brasa mediana, kg_per_unit: 1.6}
    - {id: P0007, name: Brasa 7, subcategory: Brasa mediana, kg_per_unit: 1.7}
    - {id: P0008, name: Brasa 8, subcategory: Brasa grande, kg_per_unit: 1.8}
    - {id: P0009, name: Brasa 9, subcategory: Brasa grande, kg_per_unit: 1.9}
    - {id: P0010, name: Brasa 10, subcategory: Brasa grande, kg_per_unit: 2.0}

# Vendedores (id_usuario U0001..U0007 de la tabla maestra). Solo se crean con APP_ENV=local, con la
# contraseña de PLANNING_DEMO_PASSWORD (por defecto demo1234). En producción, el primer supervisor
# se crea con `cli supervisor --general` y él da de alta las demás cuentas desde la app.
# El jefe de despacho de prueba (`despacho`) registra el stock de despacho.
# SUPUESTO: los supervisores son de prueba; la tabla maestra no indica quién administra las cuentas.
users:
  - {username: general, name: Supervisor general de prueba, role: general_supervisor}
  - {username: supervisor, name: Supervisor de prueba, role: supervisor}
  - {username: despacho, name: Jefe de despacho de prueba, role: dispatch_chief}
  - {username: rnavarro, name: Roberto Navarro, zone: Trujillo}       # U0001
  - {username: hdias, name: Hebert Días, zone: Chiclayo}               # U0002
  - {username: mcordova, name: Miguel Córdova, zone: Piura}            # U0003
  - {username: gfernandez, name: Gary Fernández, zone: San Martín}     # U0004
  - {username: jgonzales, name: Jhony Gonzales, zone: Chimbote}        # U0005
  - {username: cvillalobos, name: César Villalobos, zone: Trujillo}    # U0006
  - {username: eauleste, name: Estuardo Auleste, zone: Trujillo}       # U0007
